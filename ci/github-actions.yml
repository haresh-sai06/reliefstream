name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt pytest httpx ruff
      - run: ruff check backend eval tests --select E9,F63,F7,F82
      - run: pytest -q
      - run: python eval/run_eval.py --mode gold > /dev/null
  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t reliefstream:ci .
      - run: |
          docker run -d --name rs -p 8000:8000 reliefstream:ci
          for i in $(seq 1 20); do curl -fs localhost:8000/healthz && exit 0; sleep 1; done
          docker logs rs; exit 1
