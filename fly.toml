# Fly.io config. Not deployed yet:  fly launch --no-deploy && fly secrets set LLM_API_KEY=... && fly deploy
app = "reliefstream"
primary_region = "maa"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8000"
  LLM_BASE_URL = "https://api.groq.com/openai/v1"
  LLM_MODEL = "llama-3.3-70b-versatile"
  DATABASE_PATH = "/data/reliefstream.db"

[[mounts]]
  source = "reliefstream_data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    method = "GET"
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
